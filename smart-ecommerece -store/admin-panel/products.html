<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen">
  <!-- Sidebar same as dashboard -->
  <aside class="fixed left-0 top-0 h-full w-64 bg-white shadow-xl z-40">
    <!-- ... sidebar content same as dashboard.html ... -->
  </aside>

  <main class="ml-64 p-8">
    <div class="flex items-center justify-between mb-12">
      <div>
        <h1 class="text-4xl font-bold bg-gradient-to-r from-gray-900 to-gray-700 bg-clip-text text-transparent">
          Products Management
        </h1>
        <p class="text-xl text-gray-600 mt-2">Manage your product catalog and inventory</p>
      </div>
      <button class="bg-gradient-to-r from-green-500 to-emerald-600 text-white px-8 py-4 rounded-2xl font-semibold shadow-xl hover:shadow-2xl transition-all">
        + Add New Product
      </button>
    </div>

    <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
      <!-- Search and Filters -->
      <div class="p-8 border-b border-gray-200">
        <div class="flex flex-col lg:flex-row gap-4">
          <div class="relative flex-1">
            <input type="text" placeholder="Search products..." class="w-full pl-12 pr-4 py-4 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 h-6 w-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </div>
          <select class="px-6 py-4 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500">
            <option>All Categories</option>
            <option>Electronics</option>
            <option>Fashion</option>
          </select>
          <button class="px-8 py-4 bg-blue-600 text-white rounded-2xl hover:bg-blue-700 font-semibold">
            Filters
          </button>
        </div>
      </div>

      <!-- Products Table -->
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-8 py-6 text-left text-sm font-semibold text-gray-900 uppercase">Product</th>
              <th class="px-8 py-6 text-left text-sm font-semibold text-gray-900 uppercase">Price</th>
              <th class="px-8 py-6 text-left text-sm font-semibold text-gray-900 uppercase">Stock</th>
              <th class="px-8 py-6 text-left text-sm font-semibold text-gray-900 uppercase">Rating</th>
              <th class="px-8 py-6 text-left text-sm font-semibold text-gray-900 uppercase">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            <tr>
              <td class="px-8 py-6 whitespace-nowrap">
                <div class="flex items-center">
                  <div class="w-16 h-16 bg-gradient-to-br from-blue-400 to-purple-500 rounded-xl flex items-center justify-center mr-4">
                    iPhone
                  </div>
                  <div>
                    <p class="font-semibold text-gray-900">iPhone 15 Pro Max</p>
                    <p class="text-sm text-gray-500">Electronics</p>
                  </div>
                </div>
              </td>
              <td class="px-8 py-6 whitespace-nowrap text-lg font-bold text-gray-900">$1,199</td>
              <td class="px-8 py-6 whitespace-nowrap">
                <span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-sm font-medium">124 in stock</span>
              </td>
              <td class="px-8 py-6 whitespace-nowrap">
                <div class="flex items-center">
                  <div class="flex text-yellow-400">
                    ★★★★☆
                  </div>
                  <span class="ml-2 text-sm text-gray-500">(1,247)</span>
                </div>
              </td>
              <td class="px-8 py-6 whitespace-nowrap text-sm font-medium">
                <button class="text-blue-600 hover:text-blue-500 mr-4">Edit</button>
                <button class="text-red-600 hover:text-red-500">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</body>
</html>
