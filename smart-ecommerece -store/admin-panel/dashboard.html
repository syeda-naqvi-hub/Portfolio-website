<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - SmartStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen">
  <!-- Sidebar -->
  <aside class="fixed left-0 top-0 h-full w-64 bg-white shadow-xl z-40">
    <div class="p-6">
      <h1 class="text-2xl font-bold text-gray-900">SmartStore Admin</h1>
    </div>
    <nav class="mt-8">
      <a href="dashboard.html" class="flex items-center px-6 py-4 text-gray-900 bg-blue-50 border-r-4 border-blue-500">
        <svg class="w-6 h-6 mr-3" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
        </svg>
        Dashboard
      </a>
      <a href="products.html" class="flex items-center px-6 py-4 hover:bg-gray-100">
        <svg class="w-6 h-6 mr-3" fill="currentColor" viewBox="0 0 20 20">
          <path d="M3 3a1 1 0 000 2v8a2 2 0 002 2h2.586l.707.707A1 1 0 007.707 18H15a1 1 0 001-1v-2a1 1 0 00-1-1H7.414l-.293-.293A1 1 0 007 14H5a1 1 0 01-1-1V5a1 1 0 000-2H3z"></path>
        </svg>
        Products
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="ml-64 p-8">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-12">
      <!-- Stats Cards -->
      <div class="bg-white p-8 rounded-3xl shadow-xl">
        <div class="flex items-center">
          <div class="p-4 bg-blue-100 rounded-2xl">
            <svg class="w-12 h-12 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
              <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
            </svg>
          </div>
          <div>
            <p class="text-3xl font-bold text-gray-900">$45,678</p>
            <p class="text-gray-600">Revenue</p>
          </div>
        </div>
      </div>
    </div>
    
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- Recent Orders -->
      <div class="bg-white rounded-3xl shadow-xl p-8">
        <h2 class="text-2xl font-bold mb-6">Recent Orders</h2>
        <div class="space-y-4">
          <div class="flex items-center p-4 bg-gray-50 rounded-2xl">
            <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center mr-4">
              #1234
            </div>
            <div class="flex-1">
              <p class="font-semibold">John Doe</p>
              <p class="text-sm text-gray-600">Shipped</p>
            </div>
            <div class="text-right">
              <p class="font-bold">$89.99</p>
              <p class="text-sm text-gray-600">Jan 15</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
